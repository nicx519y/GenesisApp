<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>新用户引导 · 真机截图标注</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#202831;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}nav{position:sticky;top:0;z-index:10;background:#fff;padding:16px 24px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #dfe4ea}nav button{padding:10px 16px;border:1px solid #cbd4dd;background:white;border-radius:7px;cursor:pointer}nav button.active{background:#202831;color:white}.board{width:1380px;min-height:1150px;margin:24px auto;padding:38px 44px 32px;background:white;border-radius:16px}.eyebrow{font-size:14px;letter-spacing:1px;color:#617186;margin-bottom:10px}h1{font-size:31px;margin:0 0 10px;line-height:1.4}.summary{font-size:17px;color:#506076;margin:0 0 26px;line-height:1.6}.layout{display:grid;grid-template-columns:432px 1fr;gap:48px}.shot{position:relative;width:432px;height:936px;overflow:visible;border:1px solid #dce1e5;align-self:start}.shot img{display:block;width:100%;height:100%}.shot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.notes{display:flex;flex-direction:column;gap:14px}.note{padding:20px 22px;border:1px solid #dce4ed;border-radius:10px;background:#fafbfd;cursor:pointer}.note.active{border-color:#2475ce;background:#edf6ff}.notehead{display:flex;gap:10px;align-items:center;font-size:20px;font-weight:650;line-height:1.5}.num{display:inline-flex;align-items:center;justify-content:center;min-width:56px;padding:3px 8px;border-radius:5px;background:#2469ad;color:#fff;font-size:15px}.tag{color:#216496;font:600 14px/1.6 ui-monospace,monospace;margin:10px 0 8px}.note p{font-size:17px;line-height:1.7;white-space:pre-line;margin:0;color:#384b60}.foot{font-size:13px;color:#718093;line-height:1.7;margin-top:16px}.meta{margin-top:18px;padding:14px 18px;background:#f2f4f6;border-radius:8px;color:#526272;font-size:14px;line-height:1.7}.export nav{display:none}.export .board{margin:0;border-radius:0}a{color:#22639e}.capturelabel{font-size:12px;background:#fff;color:#617186;padding:7px 0}.highlight{fill:none;stroke:#69bdff;stroke-width:4;stroke-dasharray:12 8}.marker{fill:#2469ad;stroke:white;stroke-width:3}.markertext{fill:#fff;font:600 28px -apple-system,sans-serif;text-anchor:middle;dominant-baseline:central}.muted .highlight{stroke-opacity:.45}.selected .highlight{stroke:#ffe270;stroke-width:6;stroke-dasharray:none}.selected .marker{fill:#8c6300}@media(max-width:1399px){.board{margin:20px;width:calc(100% - 40px);padding:26px}.layout{grid-template-columns:minmax(280px,432px) minmax(350px,1fr);gap:32px}.shot{width:100%;height:auto;aspect-ratio:1080/2340}}@media(max-width:760px){.layout{grid-template-columns:1fr}.shot{max-width:432px;margin:auto}.board{padding:20px}h1{font-size:24px}}@media print{nav{display:none}.board{margin:0;box-shadow:none}}

const frames=[{"id": "01", "title": "首次进入 · 必填表单", "file": "01-form-empty-phone.png", "summary": "先加载 Worldo 列表，再检查当前设备或账号的完成状态。", "notes": [["01.1", [30, 230, 1020, 390], "底层列表正常加载", "F01 · A05 / A06", "列表与资料检查并行。无缓存时用现有骨架，失败可重试；不得先清空页面。截图背景是真实列表，当前预览尚未按 Gender 刷新。"], ["01.2", [25, 664, 1030, 1585], "设备未完成 → 必填表单", "F01 / F02 · B01 / B03", "按 deviceid 查询；已有登录态则以当前 UID 资料为准。表单无关闭、无跳过，遮罩、拖动和返回均不能绕过。"], ["01.3", [40, 845, 990, 715], "Gender、Age 都是必填", "F03 · B02 / B04", "两组均不预选。允许未提交草稿只选一项；已保存资料必须两项都有或两项都没有。"], ["01.4", [265, 1766, 550, 135], "已有账号进入登录", "F05 · A01 / A02", "点击 Sign in 在同一 Sheet 进入图 04，保留当前草稿，不写入完成状态。"]]}, {"id": "02", "title": "校验 · Continue 未满足条件", "file": "02-form-validation-phone.png", "summary": "提示缺失字段，不提交、不进入订阅。", "notes": [["02.1", [185, 1115, 700, 110], "两项未选时的真实 Toast", "F03 · 纯前端校验", "Please select your gender and age.\n仅缺 Gender / Age 时，分别提示 Please select your gender. / Please select your age."], ["02.2", [40, 1631, 995, 135], "禁用态仍可点击查看原因", "F03 · 无保存请求", "保持禁用视觉，只执行提示；不得触发 deviceid/UID 保存或跳到订阅。完整校验还需在服务端重复执行。"]]}, {"id": "04", "title": "登录 · 两种资料分支", "file": "04-sign-in-phone.png", "summary": "登录成功之后必须再检查 UID 的 Gender 与 Age。", "notes": [["04.1", [40, 707, 100, 83], "返回表单，保留草稿", "F05 · 无保存请求", "返回仅在登录未进行时可用；系统返回与此一致。取消授权停留登录，失败提示后可重试。"], ["04.2", [40, 1350, 995, 355], "复用 Google / Apple 登录", "F07 / F11 · A03+B03 / B01 / B05", "UID 已有两项：保留原值；UID 为空且设备已填：复制设备两项到 UID。两种情况均不清空设备。仅两边均无保存资料时回图 05；未提交草稿不算设备记录。"], ["04.3", [200, 1263, 690, 67], "250 Gems 是注册奖励提示", "现有登录 / 钱包链路", "不得仅因点击登录按钮就在客户端加余额。新用户奖励的发放与幂等以既有服务端规则为准，本次不新增奖励接口。"], ["04.4", [90, 1750, 900, 108], "协议复用现有页面", "现有法律文档路由", "点击对应链接打开现有文档，返回后仍在本登录步骤。截图里的 Google / Apple 均为开发预览模拟。"]]}, {"id": "05", "title": "已登录 · 仍需完成资料", "file": "05-signed-in-form-phone.png", "summary": "UID 与设备表均未保存资料时需要填写；已登录后隐藏登录入口。", "notes": [["05.1", [40, 840, 800, 63], "UID 与设备均未保存资料，返回表单", "F07 / F11 · A03+B03 / B01", "图中是两边均无已保存资料的分支。如果设备已经完整，应复制给空 UID，并保留设备记录，不再要求重新填写。查询失败应重试，不能当作空资料。"], ["05.2", [40, 935, 995, 717], "保留登录前的未提交草稿", "F07 · 只在本次流程内保留", "图中仍显示 Female、25-34，是登录前的未提交草稿；并不代表 UID 已保存。若没有草稿，两组仍为空。"], ["05.3", [40, 2118, 995, 165], "无 Sign in 链接，只可确认提交", "F06 / F07 · B04", "Continue 把两项作为整体写入当前登录 UID。保存成功后进订阅；这里不再显示登录入口，也不能跳过填写。"]]}, {"id": "06", "title": "订阅 · 保存后的可选步骤", "file": "06-subscription-phone.png", "summary": "资料保存与购买订阅是两件事，Skip 不撤销资料。", "notes": [["06.1", [906, 706, 130, 85], "Skip 关闭订阅", "F08 · 无购买请求", "保留已保存的设备或账号资料。关闭后回到列表；再次启动不因跳过订阅而重新要求填表。"], ["06.2", [40, 844, 995, 797], "权益和套餐从商品接口读取", "F09 · A08", "正式接入读取所选商品的 benefits、价格与资格。截图中的权益、标签和价格均为写死的 Demo；正式内容、数量和顺序以接口为准。"], ["06.3", [40, 1732, 995, 255], "切换 Yearly / Monthly", "F09 · A08", "切套餐只更新选中套餐及其权益和金额；付款前重新读取当前购买资格，沿用现有商品、商店流程。"], ["06.4", [40, 2073, 995, 133], "购买需等待服务端确认", "F09 · A09 / A10 / A11 / A12", "登录用户走购买上报；游客走 prepare / guest report，确认成功后复用强制登录与 claim。取消或失败仍可留在订阅选择或 Skip。"], ["06.5", [204, 2238, 674, 62], "协议保留现有跳转", "现有法律文档路由", "不以打开协议或点击购买按钮作为购买完成标记。"]]}, {"id": "07", "title": "权益列表 · 向下查看", "file": "07-subscription-benefits-phone.png", "summary": "截图内容是写死的排版 Demo；正式权益按当前选中商品的后端数据展示。", "notes": [["07.1", [40, 1020, 995, 615], "权益内容、数量与顺序由后端返回", "F09 · A08 benefits", "按当前选中商品的 benefits 数组展示。截图中的 8 条仅用于演示排版，不是固定条数或正式商品配置要求。"], ["07.2", [904, 1115, 80, 345], "右侧标签按 display_type 映射", "A08 · display_type", "每条根据接口值显示：enhanced 为红色 up，locked 为灰色锁，included 为对勾。不按“前 7 条”或条目名称指定状态。"], ["07.3", [904, 1490, 80, 80], "此处对勾仅是 Demo 数据", "A08 · display_type", "截图这条 Demo 的 display_type 为 included。正式状态以接口为准，不要求 Gem Recharge 必须为对勾；展示权益不等于执行充值或授权。"]]}, {"id": "08", "title": "流程结束 · 返回 Worldo list", "file": "08-worldo-list-phone.png", "summary": "背景列表一直存在；完成资料后按当前有效身份刷新。", "notes": [["08.1", [32, 245, 1015, 84], "重新载入分类", "F04 / F10 · A05", "Gender 改变或登录身份改变时失效旧分类缓存。保留仍有效的分类，否则回 For you。"], ["08.2", [5, 335, 1070, 960], "For You 刷新游标归零", "F10 · A06 / A07", "For You 使用 feed(start_score=0)；其他分类使用 list(pn=1)。丢弃旧身份、旧 Gender 的迟到响应。"], ["08.3", [5, 1350, 1070, 780], "下次启动是否再弹按保存状态判断", "F01 / F02 · B01 / B03", "已经完成的设备或 UID 不再弹表单。此截图是实际关闭预览后的列表，尚不证明后端推荐或持久化已接通。"]]}];
const params=new URLSearchParams(location.search);if(params.has('export'))document.body.classList.add('export');
function render(id){const f=frames.find(x=>x.id===id)||frames[0]; document.title=f.title+' · 真机标注'; document.querySelector('nav').innerHTML=frames.map(x=>`<button class="${x.id===f.id?'active':''}" data-id="${x.id}">${x.id} ${x.title.split(' · ')[0]}</button>`).join('');
const rects=f.notes.map((n,i)=>{let[x,y,w,h]=n[1];return `<g data-n="${i}"><rect class="highlight" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><rect class="marker" x="${x+4}" y="${y-21}" width="84" height="44" rx="8"/><text class="markertext" x="${x+46}" y="${y+1}">${n[0]}</text></g>`}).join('');
document.querySelector('main').innerHTML=`<article class="board"><div class="eyebrow">WORLDO · 新用户引导 / 逻辑与接口交接 · 2026-09-14</div><h1>${f.id}　${f.title}</h1><p class="summary">${f.summary}</p><div class="layout"><div><div class="shot"><img src="${f.file}" alt="${f.title}的 Android 真机截图"><svg viewBox="0 0 1080 2340">${rects}</svg></div><div class="capturelabel">真机原图 1080 × 2340 · Developer 预览 · <a href="${f.file}">打开未标注原图</a></div></div><aside class="notes">${f.notes.map((n,i)=>`<section class="note" data-n="${i}"><div class="notehead"><span class="num">${n[0]}</span>${n[2]}</div><div class="tag">${n[3]}</div><p>${n[4]}</p></section>`).join('')}<div class="meta">F 编号对应需求文档「用户流程」；A 编号为现有接口；B 编号为待新增 / 扩展契约。<br>截图中的 Preview options / debug 仅用于开发，不是正式用户入口。点击说明可高亮对应区域。</div><div class="foot">原图来自连接手机的屏幕直接截图，标注为单独的文档图层。<br>需求与接口详见同目录 README.md；样式规范统一位于文档末尾。</div></aside></div></article>`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{history.replaceState(null,'','?frame='+b.dataset.id);render(b.dataset.id)});document.querySelectorAll('.note').forEach(n=>n.onclick=()=>{document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('selected',x.dataset.n===n.dataset.n));document.querySelectorAll('.note').forEach(x=>x.classList.toggle('active',x===n));});}
render(params.get('frame')||'01');
</script></html>
